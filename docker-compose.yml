name: personal-dev-site

services:
  web:
    build: .
    container_name: personal-dev-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:1314:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
